function render(){const isDetail=selected!==null;$('#screen').textContent=(isDetail?'M05-20':'M05-19')+' · UI033';$('#heading').textContent=isDetail?(selected==='new'?'Новая работа':'Работа'):me.role==='senior'?'Старший термист':'Термист';$('#who').textContent=demo?'Учебный термист':me.login;$('#add').hidden=isDetail||!writer;$('#add').disabled=!allowed();$('#main').innerHTML=isDetail?detail():list();status();if($('#form')){$('#form').oninput=()=>{saveDraft();if($('#review'))$('#review').disabled=true};$('#form').onsubmit=save}if($('#back'))$('#back').onclick=()=>{saveDraft();selected=null;dirty=false;render()};if($('#review'))$('#review').onclick=()=>append({id:uuid(),record:selected,reviewOf:record(selected).id});if($('#retry'))$('#retry').onclick=send;if($('#pendingExport'))$('#pendingExport').onclick=()=>download('kist-unconfirmed.json',pending);if($('#refresh'))$('#refresh').onclick=async()=>{if(!confirm('Сначала скачай неподтверждённый ввод. Убрать его из этой вкладки и обновить журнал?'))return;try{const r=await fetch('/api/state',{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error);accept(j);notice="";formError="";pending=null;conflict=false;localStorage.removeItem(key+'.pending');render()}catch(e){status(e.message)}}}
async function append(e){if(!allowed())return;const next=copy(current.state);next.simpleJournal=next.simpleJournal||[];next.simpleJournal.push({...e,actor:me.login,recordedAt:now()});if(demo){const j={...current,state:next,revision:current.revision+1};if(!write(key+'.demo',j)){error('Не удалось сохранить в браузере. Ввод сохранён в форме.');return}current=j;clearDraft();selected=null;dirty=false;render();toast('Сохранено в демо');return}write(key+'.pendingDraft',draftKey());pending={database:current.database,revision:current.revision,command:uuid(),body:next};if(!write(key+'.pending',pending)){pending=null;error('Не удалось сохранить неподтверждённый ввод. Скопируй данные перед повтором.');return}await send()}
async function save(ev){ev.preventDefault();formError='';notice='';if(!allowed())return;saveDraft();const d=formData();try{d.order=d.order.trim();d.name=d.name.trim();if(!d.date||!d.order||!d.name||!Number.isInteger(Number(d.qty))||Number(d.qty)<1||Number(d.qty)>1000000000)throw Error('Укажи дату, заказ, наименование и целое количество больше нуля.');d.qty=Number(d.qty);for(const k of ['start','end'])if(d[k]){const t=new Date(d[k]);if(Number.isNaN(t.getTime())||t>new Date)throw Error('Проверь дату и время: будущий факт сохранить нельзя.');d[k]=t.toISOString()}if(d.end&&!d.start)throw Error('Укажи начало обработки.');if(d.end&&new Date(d.end)<new Date(d.start))throw Error('Окончание раньше начала.');d.final=d.final.trim();if(!!d.end!==!!d.final)throw Error('Для завершения укажи окончание и конечную твёрдость.');await append({id:uuid(),record:selected==='new'?uuid():selected,data:d})}catch(e){error(e.message)}}
$('#add').onclick=()=>{formError='';selected='new';dirty=!!read(draftKey());render();$('#f-order')?.focus()};$('#main').onclick=e=>{const row=e.target.closest('[data-record]');if(row){formError='';selected=row.dataset.record;dirty=!!read(draftKey());render();return}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render()}const n=e.target.closest('[data-now]');if(n){$('#f-'+n.dataset.now).value=local(now());saveDraft();if($('#review'))$('#review').disabled=true}};
$('#export').onclick=()=>download('kist-journal.json',{...current,user:{login:me.login,role:me.role}});$('#logout').onclick=async()=>{if(pending||dirty){toast('Сначала сохрани введённую запись');return}if(demo){if(confirm('Сбросить только это учебное демо?')){localStorage.removeItem(key+'.demo');location.reload()}return}try{const r=await fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':me.csrf},body:'{}'});if(!r.ok)throw Error('Не удалось выйти');location.reload()}catch(e){status(e.message)}};
window.addEventListener('beforeunload',e=>{if(pending||dirty){e.preventDefault();e.returnValue=''}});render();if(!demo)setInterval(async()=>{if(pending||busy||selected!==null||document.hidden)return;try{const r=await fetch('/api/state',{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error);accept(j);render()}catch(e){status('Связь с сервером не подтверждена: '+e.message)}},5000);
})();
</script></body></html>
