async function accept(request,result){if(request.action!=='bootstrap'&&!info.workplaces.length)await refresh();if(request.action==='create_user'){issued={login:result.login,password:request.password,role:result.role};await refresh();notice('Создан личный вход: '+result.login+' · теперь назначь рабочее место')}else if(request.action==='bootstrap'){info=result;render()}else if(request.action==='lookup'){card=result;editor=null;colour=result.assessments?.find(a=>a.actor===me.login&&a.workplace_id===workplace&&!a.stale)?.colour||'grey';render();notice(result.found?'Просмотр зарегистрирован · '+fmt(result.viewRecordedAt):'Поиск зарегистрирован. Такой заказ-наряд пока не найден.',!result.found)}else if(request.action==='save_workplace'){editor=null;await refresh()}else if(request.action==='save_order'){editor=null;await refresh();await lookup(result.number)}else if(request.action==='assess'){notice('Оценка зарегистрирована'+(result.signal?' · вопрос/проблема сохранены отдельно':''));await lookup(card.number)}else if(request.action==='preview_import'){preview={...result,batch:request.batch,workplace:request.workplace};render()}else if(request.action==='import_orders'){importBatch=null;preview=null;card=null;await refresh();notice('Записано нарядов: '+result.imported+' · без изменений: '+(result.skipped||0))}else if(request.action==='audit'){$('#audit').innerHTML=result.events.map(e=>'<div class="row audit"><div><b>'+esc(e.kind)+'</b><br>'+esc(e.actor)+' · '+esc(nameOf(e.workplace_id))+'<br>'+esc(fmt(e.received_at))+'<br>'+esc(e.order_id||'')+'</div></div>').join('')||'<p>Записей пока нет</p>'}else if(request.action==='history'){$('#history').innerHTML=result.revisions.map(r=>'<div class="panel"><b>Редакция '+r.sequence+'</b> · '+esc(sourceName(r.source))+'<br>'+esc(r.actor)+' · '+esc(fmt(r.recorded_at))+'<pre>'+esc(JSON.stringify(r.data,null,2))+'</pre></div>').join('')}}
function field(name,label,value,type='text'){return '<div><label for="'+name+'">'+label+'</label><input id="'+name+'" name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(name==='number'?'inputmode="numeric" pattern="[0-9]{5}" maxlength="5" required':'')+'></div>'}
function admin(){return (issued?'<div class="panel" id="issuedCredentials"><h2>Передать сотруднику</h2><p>Вход создан. Скопируй реквизиты и передай их лично. Затем назначь этому логину рабочее место.</p><p>Логин: <b>'+esc(issued.login)+'</b><br>Пароль: <code>'+esc(issued.password)+'</code></p><button id="copyCredentials">Скопировать реквизиты</button><button id="hideCredentials">Скрыть реквизиты</button><p class="muted">После закрытия или обновления страницы пароль повторно не показывается.</p></div>':'')+'<div class="toolbar"><button class="primary" id="newPlace">+ Рабочее место / группа</button></div><div class="panel"><h2>Иерархия рабочих мест</h2>'+info.workplaces.map(w=>'<div class="row"><div><b>'+esc(displayName(w))+'</b><br><small>'+esc(w.kind==='group'?'Группа':w.login+' · '+w.functions.join(', '))+' · '+(w.enabled?'включено':'отключено')+'</small></div><button data-edit-place="'+esc(w.id)+'">Изменить</button></div>').join('')+'</div><details><summary>Личные учётные записи</summary><form id="userForm"><p>Администратор создаёт вход, назначает рабочее место и лично передаёт реквизиты сотруднику.</p><button type="button" id="suggestCredentials">Предложить логин и пароль</button><label>Новый личный логин</label><input name="login" autocomplete="off" required maxlength="80"><label>Роль</label><select name="role"><option value="supervisor">Супервайзер</option><option value="thermist">Термист</option><option value="senior">Старший термист</option><option value="dispatcher">Диспетчер</option><option value="observer">Просмотр</option><option value="admin">Администратор</option></select><label>Личный пароль (не менее 12 символов)</label><input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="500" required><button type="button" id="showPassword">Показать пароль</button><button class="primary" id="createUser">Создать личный вход</button></form><p class="muted">Пароль не сохраняется в журнале действий или локальном файле повторов. Затем назначь пользователю именное рабочее место.</p>'+info.users.map(x=>'<p>'+esc(x.login)+' · '+esc(x.role)+'</p>').join('')+'</details><div class="panel"><h2>Журнал просмотров и действий</h2><button id="auditLoad">Показать последние 200</button><div id="audit"></div></div>'}
function placeForm(){const e=editor;return '<div class="panel"><h2>'+esc(e.id?'Рабочее место':'Новое рабочее место')+'</h2><form id="placeForm"><label>Имя</label><input name="name" value="'+esc(e.name||'')+'" required maxlength="200"><label>Тип</label><select name="kind"><option value="group" '+(e.kind==='group'?'selected':'')+'>Группа</option><option value="terminal" '+(e.kind==='terminal'?'selected':'')+'>Именное веб-место / сотик</option></select><label>Родитель</label><select name="parent"><option value="">Корень</option>'+info.workplaces.filter(x=>x.kind==='group'&&x.id!==e.id).map(x=>'<option value="'+esc(x.id)+'" '+(x.id===e.parent_id?'selected':'')+'>'+esc(displayName(x))+'</option>').join('')+'</select><label>Личный логин (для веб-места)</label><select name="login"><option value="">Не назначен</option>'+info.users.map(x=>'<option '+(x.login===e.login?'selected':'')+'>'+esc(x.login)+'</option>').join('')+'</select><label>Функции веб-места</label>'+[['supervisor','Суперглаз'],['dispatcher','Диспетчер'],['thermist','Термист — первичные сведения']].map(([v,t])=>'<label class="check"><input type="checkbox" name="functions" value="'+v+'" '+((e.functions||[]).includes(v)?'checked':'')+'>'+t+'</label>').join('')+'<label class="check"><input type="checkbox" name="enabled" '+(e.enabled!==false&&e.enabled!==0?'checked':'')+'>Включено</label><button class="primary">Сохранить</button><button type="button" id="cancel">Отмена</button></form></div>'}
function positions(data){return data.positions.length?data.positions.map(p=>'<div class="position"><b>'+esc(p.position||'—')+' · '+esc(p.name||'Наименование не указано')+'</b><p>Количество: '+esc(p.qty??'—')+' · Сталь: '+esc(p.steel||'—')+'</p>'+(p.customerName?'<p>По требованию клиента: '+esc(p.customerName)+'</p>':'')+(p.marking?'<p>Маркировка: '+esc(p.marking)+'</p>':'')+(p.requirements?'<p>'+esc(p.requirements)+'</p>':'')+'</div>').join(''):'<p class="muted">Позиции ещё не заполнены</p>'}
function cardView(){if(!card)return '';if(!card.found)return '<div class="panel"><h2>№ '+esc(card.number)+' пока нет в реестре</h2>'+(canDispatch?'<button class="primary" id="draftOrder">Создать предварительную карточку</button>':'<p>Передай номер Диспетчеру или термисту для заведения карточки.</p>')+'</div>';const d=card.data;return '<div class="panel"><h2>Заказ-наряд № '+esc(card.number)+'</h2><p class="tag">'+esc(sourceName(card.source))+'</p><h3>'+esc(d.description||'Характеристики ещё не заполнены')+'</h3><p>Заказ: '+esc(d.orderNumber||'—')+'<br>Заказчик: '+esc(d.customer||'—')+'<br>Срок: '+esc(d.due||'—')+'</p>'+([['customerOrder','Заказ клиента / основание'],['contract','Договор / спецификация'],['launchDate','Дата запуска']].filter(([k])=>d[k]).map(([k,label])=>'<p>'+label+': '+esc(d[k])+'</p>').join(''))+'<p>'+esc(d.note)+'</p><div class="positions">'+positions(d)+'</div><p class="muted">Внесено: '+esc(fmt(card.recordedAt))+' · '+esc(card.actor)+' · редакция '+card.sequence+'</p>'+(card.sourceMeta?.exportedAt?'<p class="muted">Снимок выгружен: '+esc(fmt(card.sourceMeta.exportedAt))+' · '+esc(card.sourceMeta.sourceFile||'')+'</p>':'')+(section==='dispatch'&&(master||card.source==='THERMIST_PRELIMINARY')?'<button class="primary" id="editOrder">Дополнить карточку</button>':'')+'<details><summary>Идентичность и просмотр</summary><p class="muted">Постоянный ID: '+esc(card.id)+'<br>Просмотр: '+esc(fmt(card.viewRecordedAt))+' · '+esc(nameOf(workplace))+'</p></details></div>'+ (section==='eye'?assessmentView():'')+'<div class="panel"><h2>Открытые вопросы и предварительные проблемы · '+card.signals.length+'</h2>'+card.signals.map(s=>'<div class="signal '+(s.kind==='PRELIMINARY_PROBLEM'?'red':'')+'"><b>'+(s.kind==='PRELIMINARY_PROBLEM'?'Предварительная проблема':'Вопрос')+'</b><p>'+esc(s.note)+'</p><small>'+esc(s.actor)+' · '+esc(fmt(s.created_at))+' · ответственный и план ещё не назначены</small></div>').join('')+'<p class="muted">Новая зелёная оценка не закрывает ранее зарегистрированные вопросы и проблемы. План реагирования добавим следующим этапом.</p></div>'+(['admin','dispatcher','senior','supervisor'].includes(me.role)?'<details><summary>История карточки</summary><button id="historyLoad">Загрузить редакции</button><div id="history"></div></details>':'')}
function assessmentView(){return '<div class="panel"><h2>Моя оценка</h2><p class="muted">Оценка наблюдателя; соответствие продукции и разрешение на использование фиксируются отдельно.</p>'+(canAssess?'<div class="ratings">'+[['grey','Не определено'],['green','Норма, нет вопросов'],['yellow','Вопрос'],['red','Проблема, предварительно']].map(([v,t])=>'<button type="button" data-colour="'+v+'" class="rating '+v+'" aria-pressed="'+(colour===v)+'"><span class="dot"></span>'+t+'</button>').join('')+'</div><label for="assessmentNote">Формулировка (обязательна для жёлтого и красного)</label><textarea id="assessmentNote" maxlength="2000">'+esc(card.assessments.find(a=>a.actor===me.login&&a.workplace_id===workplace&&!a.stale)?.note||'')+'</textarea><button class="primary" id="saveAssessment">Сохранить оценку</button>':'<p>Твоя роль разрешает просмотр. Для оценки нужна роль супервайзера или старшего термиста.</p>')+'<h3>Последние оценки наблюдателей</h3>'+card.assessments.map(a=>'<div class="row"><div><span class="tag">'+esc({grey:'Серый',green:'Зелёный',yellow:'Жёлтый',red:'Красный'}[a.colour])+'</span> '+esc(a.actor)+' · '+esc(a.workplaceName||nameOf(a.workplace_id))+'<p>'+esc(a.note)+'</p><small>'+esc(fmt(a.recorded_at))+(a.stale?' · оценка предыдущей редакции карточки':'')+'</small></div></div>').join('')+'</div>'}
function orderForm(){const e=editor,d=e.data;return '<div class="panel"><h2>'+esc(master?'Данные Диспетчера':'Предварительные сведения термиста')+'</h2><form id="orderForm"><div class="grid">'+field('number','Номер заказа-наряда · пять цифр',e.number)+field('orderNumber','Номер заказа (отдельный реквизит)',d.orderNumber)+field('description','Описание',d.description)+field('customer','Заказчик',d.customer)+field('due','Срок / дата',d.due)+'</div><label>Примечание</label><textarea name="note" maxlength="2000">'+esc(d.note)+'</textarea><h3>Позиции</h3>'+d.positions.map((p,i)=>'<div class="position"><div class="grid">'+field('p'+i+'position','Поз.',p.position)+field('p'+i+'name','Наименование',p.name)+field('p'+i+'steel','Сталь',p.steel)+field('p'+i+'qty','Количество',p.qty??'','number')+'</div><label>Требования</label><textarea name="p'+i+'requirements">'+esc(p.requirements)+'</textarea></div>').join('')+'<button type="button" id="addPosition">+ Позиция</button><div><button class="primary">Сохранить карточку</button><button type="button" id="cancel">Отмена</button></div></form></div>'}
function readEditor(){const f=$('#orderForm'),v=Object.fromEntries(new FormData(f));editor.number=v.number;editor.data={...editor.data,description:v.description,orderNumber:v.orderNumber,customer:v.customer,due:v.due,note:v.note,positions:editor.data.positions.map((_,i)=>{const raw=v['p'+i+'qty'];return {...editor.data.positions[i],position:v['p'+i+'position'],name:v['p'+i+'name'],steel:v['p'+i+'steel'],qty:raw===''?null:Number(raw),requirements:v['p'+i+'requirements']}})}}
function blankOrder(num=''){return {type:'order',number:num,expected:null,data:{description:'',customer:'',orderNumber:'',due:'',note:'',positions:[{position:'',name:'',steel:'',qty:null,requirements:''}]}}}
function intakeRows(){const q=intakeFilter.toLowerCase().trim();return (intake?.orders||[]).filter(o=>!q||[o.number,o.data?.orderNumber,o.data?.customer,...(o.data?.positions||[]).map(p=>p.position+' '+p.name)].join(' ').toLowerCase().includes(q))}
function selectedBatch(){if(!intake||!chosen.size)throw Error('Выбери хотя бы один наряд');const batch={...intake,orders:intake.orders.filter(o=>chosen.has(o.number))};delete batch.blockedNumbers;batch.reviewNotes=(batch.reviewNotes||[]).filter(n=>!n.number||chosen.has(n.number));if(new Blob([JSON.stringify(batch)]).size>3_500_000)throw Error('Выбранный пакет слишком велик: выбери меньше нарядов');return batch}
function importPanel(){const rows=intakeRows(),labels={new:'Новый',updated:'Изменён',unchanged:'Без изменений'};return '<div class="panel"><h2>Входные данные из Цех_сводная</h2><p>1. Сохрани книгу в Excel. 2. Выбери файл на ПК. 3. Отметь наряды и проверь изменения. 4. Подтверди запись.</p><p class="muted">XLSX/XLSM читается на этом компьютере. Макросы не выполняются; вся книга на сервер не отправляется. Берём только входные реквизиты. Формулы не пересчитываем — используются сохранённые значения Excel. Данные о выполнении операций не загружаются.</p><label for="importFile">Сводная (.xlsm/.xlsx) или подготовленный JSON</label><input id="importFile" type="file" accept=".xlsm,.xlsx,.json">'+(intake?'<p>'+esc(intake.sourceFile||'Экспорт')+' · доступно нарядов: '+intake.orders.length+' · заблокировано: '+(intake.blockedNumbers?.length||0)+'</p><details><summary>Замечания: '+(intake.reviewNotes?.length||0)+'</summary><ul>'+(intake.reviewNotes||[]).slice(0,200).map(n=>'<li>'+esc('Строка '+(n.row||n.sourceCell||'')+' · '+n.reason)+'</li>').join('')+'</ul></details><label for="intakeFilter">Поиск по наряду, заказу, заказчику или изделию</label><input id="intakeFilter" value="'+esc(intakeFilter)+'"><p>Найдено: '+rows.length+' · показано до 100 · выбрано: '+chosen.size+' / 500</p><button id="selectVisible">Выбрать показанные</button><button id="clearSelected">Снять выбор</button><div style="overflow-x:auto"><table style="width:100%;font-size:14px"><thead><tr><th>Выбор</th><th>Наряд A</th><th>Заказ B / позиция E</th><th>Заказчик / изделие</th><th>Количество / сталь</th></tr></thead><tbody>'+rows.slice(0,100).map(o=>'<tr><td><input style="width:22px;min-height:22px" type="checkbox" data-intake-number="'+esc(o.number)+'" '+(chosen.has(o.number)?'checked':'')+' aria-label="Выбрать наряд '+esc(o.number)+'"></td><td>'+esc(o.number)+'</td><td>'+esc(o.data.orderNumber)+'<br>'+esc(o.data.positions.map(p=>p.position||'№ позиции не указан').join(', '))+'</td><td>'+esc(o.data.customer)+'<br>'+esc(o.data.positions.map(p=>p.name).join('; '))+'</td><td>'+esc(o.data.positions.map(p=>(p.qty??'—')+' / '+(p.steel||'—')).join('; '))+'</td></tr>').join('')+'</tbody></table></div><button id="downloadImport">Скачать выбранные входные данные</button><button class="primary" id="previewImport">Проверить выбранные</button>':'')+(preview?'<div class="panel"><h3>Результат проверки сервера</h3><p>Новых: '+preview.new+' · изменённых: '+preview.updated+' · без изменений: '+(preview.unchanged||0)+'</p><p>Повтор неизменных сведений пропускается. Изменения сохраняются новой редакцией того же наряда; факты Т/О, оценки и открытые вопросы сохраняются отдельно. Исчезнувшие из файла наряды не удаляются.</p>'+(preview.details||[]).map(d=>'<details><summary>'+esc(d.number)+' · '+labels[d.state]+' · позиций '+d.oldPositions+' → '+d.positions+'</summary>'+(d.changes||[]).map(c=>'<p><b>'+esc(({description:'Описание',customer:'Заказчик',orderNumber:'Заказ',positions:'Позиции',due:'Срок',customerOrder:'Заказ клиента',contract:'Договор',launchDate:'Дата запуска',note:'Примечание'})[c.field]||c.field)+'</b></p><pre>Было: '+esc(JSON.stringify(c.before,null,2))+'\nСтанет: '+esc(JSON.stringify(c.after,null,2))+'</pre>').join('')+'</details>').join('')+'<p class="bad">Проверь изменения и актуальность книги. Поля выбранных нарядов будут обновлены данными файла, включая пустые значения и изменённый состав позиций. Это не подтверждает правильность исходных требований.</p><button class="primary" id="confirmImport">Подтвердить выбранный импорт</button></div>':'')+'</div>'}
function registryList(){return '<div class="panel"><h2>Реестр нарядов</h2><div class="orders-scroll" role="region" aria-label="Таблица нарядов — горизонтальная прокрутка" tabindex="0"><table class="orders-table"><colgroup><col class="ticket-col"><col><col class="source-col"><col class="open-col"></colgroup><thead><tr><th scope="col">Наряд</th><th scope="col">Наименование</th><th scope="col">Источник</th><th scope="col"><span class="visually-hidden">Открыть карточку</span></th></tr></thead><tbody>'+info.orders.map(o=>'<tr data-order="'+esc(o.number)+'"><td class="ticket-cell">'+esc(o.number)+'</td><td class="name-cell" title="'+esc(o.description)+'">'+esc(o.description||'—')+'</td><td class="source-cell" title="'+esc(sourceName(o.source))+'">'+esc(sourceName(o.source))+'</td><td><button class="order-chevron" data-order="'+esc(o.number)+'" aria-label="Открыть наряд '+esc(o.number)+'" title="Открыть наряд '+esc(o.number)+'"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"/></svg></button></td></tr>').join('')+'</tbody></table></div>'+(info.orders.length?'<small>Нажми строку или шеврон справа, чтобы открыть карточку. На телефоне таблицу можно прокрутить вправо.</small>':'<p class="empty">Нарядов пока нет.</p>')+'</div>'}

 if($('#workplace'))$('#workplace').onchange=e=>{if(busy||pending||intakeBusy){render();return}preview=null;workplace=e.target.value;write(key+'.workplace',workplace);card=null;render()};

/* Public examples have no server/session/real order data. */
function demoCall(request){const demoKey='kist.registry036.demo',s=storage(demoKey)||{workplaces:[{id:'demo-group',name:'Учебный участок',kind:'group',parent_id:null,login:null,functions:[],enabled:true,version:1},{id:'demo-phone',name:'Учебный сотик',kind:'terminal',parent_id:'demo-group',login:'demo-admin',functions:['supervisor','dispatcher','thermist'],enabled:true,version:1}],orders:[{id:'demo-order',number:'12345',revision:'demo-r1',sequence:1,data:{description:'Учебный заказ-наряд',customer:'Учебный заказчик',orderNumber:'УЧ-001',due:'',note:'Все сведения вымышлены',positions:[{position:'1',name:'Учебная деталь',steel:'40Х',qty:100,requirements:'Учебное требование'}]},source:'DISPATCHER_MANUAL',actor:'demo-admin',recordedAt:'2026-10-31T03:00:00Z',assessments:[],signals:[]}],events:[],receipts:{}};
 if(s.receipts[request.command])return s.receipts[request.command];const event=(kind,o)=>{const e={id:uuid(),kind,order_id:o?.id||null,actor:me.login,workplace_id:request.workplace||null,received_at:new Date().toISOString()};s.events.push(e);return e};let result;
 if(request.action==='create_user'){throw Error('Создание реальных личных входов доступно только на сервере; в демо используется учебный администратор')}else if(request.action==='bootstrap'){event('REGISTRY_LIST_VIEW');result={workplaces:s.workplaces,users:[{login:'demo-admin',role:'admin'}],orders:s.orders.map(o=>({id:o.id,number:o.number,description:o.data.description,source:o.source})),role:'admin'}}
 else if(request.action==='save_workplace'){if(!request.name)throw Error('Укажи имя');const old=s.workplaces.find(x=>x.id===request.id);const w={id:old?.id||uuid(),name:request.name,kind:request.kind,parent_id:request.parent||null,login:request.kind==='terminal'?request.login:null,functions:request.functions,enabled:request.enabled,version:(old?.version||0)+1};if(w.parent_id===w.id)throw Error('Цикл иерархии');if(old)s.workplaces[s.workplaces.indexOf(old)]=w;else s.workplaces.push(w);event('WORKPLACE_CHANGED');result={id:w.id}}
 else if(request.action==='lookup'){if(!/^[0-9]{5}$/.test(request.number))throw Error('Нужны пять цифр');const o=s.orders.find(x=>x.number===request.number),v=event(o?'ORDER_VIEW':'ORDER_NOT_FOUND',o);result=o?{...copy(o),found:true,assessments:o.assessments.map(a=>({...a,stale:a.revision_id!==o.revision})),view:v.id,viewRecordedAt:v.received_at}:{found:false,number:request.number}}
 else if(request.action==='save_order'){if(!/^[0-9]{5}$/.test(request.number))throw Error('Нужны пять цифр');let o=s.orders.find(x=>x.number===request.number);if(o&&o.revision!==request.expected)throw Error('Карточка изменилась');if(!o){o={id:uuid(),number:request.number,sequence:0,assessments:[],signals:[]};s.orders.push(o)}o.data=request.data;o.sequence++;o.revision=uuid();o.source='DISPATCHER_MANUAL';o.actor=me.login;o.recordedAt=new Date().toISOString();event('ORDER_CHANGED',o);result={number:o.number}}
 else if(request.action==='assess'){const v=s.events.find(x=>x.id===request.view),o=s.orders.find(x=>x.id===v?.order_id);if(!o)throw Error('Открой карточку');if(['yellow','red'].includes(request.colour)&&!request.note.trim())throw Error('Нужна формулировка');const a={id:uuid(),revision_id:o.revision,actor:me.login,workplace_id:request.workplace,colour:request.colour,note:request.note,recorded_at:new Date().toISOString(),stale:false};o.assessments=[a];let signal=null;if(['yellow','red'].includes(a.colour)){signal=uuid();o.signals.push({id:signal,kind:a.colour==='red'?'PRELIMINARY_PROBLEM':'QUESTION',note:a.note,actor:me.login,created_at:a.recorded_at})}event('ASSESSMENT_RECORDED',o);result={id:a.id,signal}}
 else if(request.action==='audit'){result={events:copy(s.events).reverse().slice(0,200)};event('AUDIT_VIEW')}
 else if(request.action==='history'){result={revisions:[]};event('HISTORY_VIEW')}
 else if(request.action==='preview_import'){if(request.batch.format!=='KIST_WORK_ORDERS_V1')throw Error('Неверный формат');const rows=request.batch.orders;result={expected:Object.fromEntries(rows.map(r=>[r.number,s.orders.find(o=>o.number===r.number)?.revision||null])),count:rows.length,new:rows.filter(r=>!s.orders.some(o=>o.number===r.number)).length,updated:rows.filter(r=>s.orders.some(o=>o.number===r.number)).length}}
 else if(request.action==='import_orders'){throw Error('Импорт с серверными проверками доступен в общей базе; в демо создай учебную карточку вручную')}
 else throw Error('Неизвестное действие');s.receipts[request.command]=copy(result);if(!write(demoKey,s))throw Error('Не удалось сохранить демо');return result}
