.sort((a,b)=>a.planDate.localeCompare(b.planDate)).at(-1);Object.assign(existing,latest);existing.basis=Math.max(...existing.history.map(h=>h.snapshot.remaining))}else n.paperQueue028.push({id:id(),...snap,basis:snap.remaining,history:[{recordedAt:now(),snapshot:snap}]});await commit(n)},'Сохранить позицию')}
let chargeLines=0;
function chargeForm(){const candidates=state.paperQueue028.filter(r=>(!alloy||r.alloy===alloy)&&(!regime||r.regime===regime));if(!candidates.length){msg('Сначала добавьте позицию из бумажного плана');return}chargeLines=0;open('charge','<h2>M05-18 · Новая садка</h2><p class="muted">Каждая строка — целый ящик. Можно объединить ящики разных позиций при одном сплаве, режиме и операции. Это ручная сверка, а не технологическое заключение системы.</p><div class="grid">'+input('charge','Номер / обозначение садки','С-'+(state.runs.length+1))+input('furnace','Печь / канал')+'</div><div id="chargeLines"></div><button type="button" id="addLine">+ Ещё ящик</button><label class="check wide" style="margin-top:16px"><input type="checkbox" name="checked" required><span>Проверены совместимость, режим/редакция, вместимость и приоритет по действующему порядку</span></label>',async f=>{const n=clone(state),members=[],chosen=[];for(let i=0;i<chargeLines;i++){if(!Object.hasOwn(f,'row'+i))continue;const r=rowBy(f['row'+i]),qty=Number(f['qty'+i]);if(!r?.regime||!r.operation)throw Error('У позиции не назначены режим и операция');if(!Number.isInteger(qty)||qty<=0)throw Error('Количество ящика должно быть целым и положительным');const number=f['box'+i].trim();if(!number)throw Error('Укажите номер каждого ящика');const b={id:id(),queue028:r.id,order:r.order,position:r.position,number,qty,passport:'П-'+number,alloy:r.alloy,regime:r.regime,operation:r.operation};n.boxes.push(b);chosen.push(b);members.push({box:b.id,qty})}if(!chosen.length)throw Error('Нет ящиков');const first=chosen[0];if(chosen.some(b=>b.alloy.trim().toUpperCase()!==first.alloy.trim().toUpperCase()||b.regime.trim().toUpperCase()!==first.regime.trim().toUpperCase()||b.operation!==first.operation))throw Error('Для общей садки должны совпадать сплав, режим/редакция и операция');for(const r of n.paperQueue028){if(n.boxes.filter(b=>b.queue028===r.id).reduce((a,b)=>a+b.qty,0)>r.basis)throw Error('Ящики превышают учётную основу позиции '+r.order+'–'+r.position)}if(n.boxes.some((b,i)=>n.boxes.some((x,j)=>j<i&&x.queue028===b.queue028&&x.number.trim().toUpperCase()===b.number.trim().toUpperCase())))throw Error('Номер ящика этой позиции уже существует');n.runs.push({id:id(),charge:f.charge,operation:first.operation,regime:first.regime,furnace:f.furnace,members,createdAt:now(),paper028:true,compatibilityChecked:true});await commit(n)},'Создать садку');
function add(){const i=chargeLines++,d=document.createElement('div');d.className='card';d.style.marginTop='12px';d.innerHTML=`${select('row'+i,'Позиция',candidates.map(r=>r.id))}<div class="boxline"><input name="box${i}" aria-label="Номер ящика" placeholder="З-12345/1" required><input type="number" name="qty${i}" aria-label="Количество" placeholder="шт." min="1" step="1" required><button type="button" aria-label="Убрать ящик">×</button></div>`;d.querySelectorAll('option').forEach(o=>{const r=rowBy(o.value);o.textContent=r.order+'–'+r.position+' · '+r.alloy+' · '+(r.regime||'режим не указан')});d.querySelector('button').onclick=()=>d.remove();$('#chargeLines').append(d)}$('#addLine').onclick=add;const saved=localGet(key+'.draft.charge');const indices=saved?Object.keys(saved).filter(k=>/^row\d+$/.test(k)).map(k=>Number(k.slice(3))):[];if(indices.length){for(let i=0;i<=Math.max(...indices);i++){add();if(!indices.includes(i))$('#chargeLines').lastElementChild.remove()}for(const el of $('#form').elements)if(el.name&&Object.hasOwn(saved,el.name)){if(el.type==='checkbox')el.checked=saved[el.name];else el.value=saved[el.name]}}else add()}
function eventObject(kind,data){return {id:id(),command:id(),kind,actor:me.login,recordedAt:now(),...data}}
function timeForm(run,kind){const prior=last(run.id,kind),label=kind==='load'?'Загрузка':'Выгрузка';open(kind+run.id,`<h2>${label} · ${esc(run.charge)}</h2><p>${esc(run.furnace)} · ${esc(run.operation)} · ${esc(run.regime)}</p><p class="notice">Предложено время устройства «сейчас». Это ещё не факт. Сверьте часы и подтвердите фактическое время.</p><div class="grid">${input('at','Фактическая дата и время',localTime(prior?.at),'datetime-local')}${prior?input('reason','Причина исправления'):''}</div>`,async f=>{const n=clone(state);n.events.push(eventObject(kind,{run:run.id,at:iso(f.at),source:'device-clock-manually-confirmed',proposedAt:now(),proposedValue:localTime(),confirmedAt:now(),...(prior?{supersedes:prior.id,reason:f.reason}:{})}));await commit(n)},prior?'Подтвердить исправление':'Подтвердить факт')}
function measureForm(box){const rr=linked(box.id).filter(r=>last(r.id,'unload'));if(!rr.length){msg('Сначала подтвердите выгрузку');return}open('measure'+box.id,`<h2>Контроль · ${esc(box.number)}</h2><div class="grid">${select('run','Обработка',rr.map(r=>r.id),rr.at(-1).id)}${input('at','Фактические дата и время',localTime(),'datetime-local')}${input('value','Результат и единица (например, 28 HRC)')}${input('sample','Проверено изделий, шт.',1,'number')}${select('result','Оценка по требованиям',['Не оценено','Не соответствует','Соответствует'])}${input('requirements','Основание оценки / требование','', 'text',false)}</div><p class="muted">Каждый повторный замер — отдельная запись. Измерение не выдаёт разрешение на использование.</p>`,async f=>{const n=clone(state);n.events.push(eventObject('measure',{box:box.id,run:f.run,at:iso(f.at),value:f.value,sample:Number(f.sample),result:f.result,requirements:f.requirements}));await commit(n)});$('#fields select[name=run]').querySelectorAll('option').forEach(o=>o.textContent=runBy(o.value).charge+' · '+runBy(o.value).regime)}
function reworkForm(box){open('rework'+box.id,`<h2>Новое назначение · ${esc(box.number)}</h2><p class="muted">Новый запуск для целого ящика. Предыдущие режимы, неудачные результаты и назначение паспорта сохранятся.</p><div class="grid">${input('regime','Новый режим и редакция',linked(box.id).at(-1)?.regime||box.regime)}${select('operation','Операция',['Нагрев','Отпуск','Повторная обработка'],'Повторная обработка')}${input('furnace','Печь / канал',linked(box.id).at(-1)?.furnace)}${input('reason','Причина повтора / изменения режима')}</div>`,async f=>{if(linked(box.id).some(r=>!last(r.id,'unload')))throw Error('Сначала завершите предыдущую обработку');await commit(null,{box:box.id,...f})},'Назначить новый запуск')}
function reviewForm(box){if(me.role!=='senior'){msg('Паспорт проверяет старший термист');return}open('review'+box.id,`<h2>Проверка паспорта · ${esc(box.number)}</h2><p>Проверьте все обработки и результаты ниже. Подтверждение относится к текущей истории; новые события потребуют повторной проверки.</p>${history(box.id)}${input('at','Дата и время проверки',localTime(),'datetime-local')}<p class="notice">Проверка паспорта не заменяет решение диспетчера / ОТК о дальнейшем использовании.</p>`,async f=>{const n=clone(state),evidence=facts(box.id).filter(e=>e.kind!=='review').map(e=>e.id);n.events.push(eventObject('review',{box:box.id,at:iso(f.at),evidence}));await commit(n)},'Подтвердить проверку')}
function handoffForm(box){const passed=state.events.filter(e=>e.kind==='handoff'&&e.box===box.id).reduce((a,b)=>a+b.qty,0);open('handoff'+box.id,`<h2>Факт передачи · ${esc(box.number)}</h2><p class="notice">Разрешение диспетчера и разбор с ОТК ведутся по действующему порядку вне приложения. Здесь регистрируется уже состоявшаяся физическая передача.</p><div class="grid">${input('qty','Фактически передано, шт.',box.qty-passed,'number')}${input('at','Дата и время факта',localTime(),'datetime-local')}${input('basis','Ссылка / примечание о действующем решении','', 'text',false)}</div><label class="check" style="margin-top:16px"><input type="checkbox" name="confirm" required><span>Подтверждаю факт передачи по действующему порядку предприятия</span></label>`,async f=>{const n=clone(state);n.events.push(eventObject('handoff',{box:box.id,qty:Number(f.qty),at:iso(f.at),basis:f.basis,releasePolicy:'external'}));await commit(n)},'Записать факт передачи')}
function history(b){const names={load:'Загрузка',unload:'Выгрузка',measure:'Контроль',review:'Проверка паспорта',handoff:'Передача'};return '<div class="history">'+facts(b).map(e=>`<p><b>${names[e.kind]}</b> · факт ${esc(fmt(e.at))}${e.value?' · '+esc(e.value)+' · '+esc(e.result):''}${e.qty?' · '+e.qty+' шт.':''}${e.supersedes?' · исправление '+esc(e.reason):''}<br><small>Зарегистрировано ${esc(fmt(e.recordedAt))} · ${esc(e.actor)}${e.basis?' · '+esc(e.basis):''}</small></p>`).join('')+'</div>'}
function renderQueue(){let rows=[...state.paperQueue028];rows.sort((a,b)=>(a[sort]+' '+a.position).localeCompare(b[sort]+' '+b.position,'ru',{numeric:true})*(desc?-1:1));return `<div class="bar"><h2>M05-1 · Вся очередь термиста</h2><button class="primary" data-action="plan" ${canEdit()?'':'disabled'}>+ Из бумажного плана</button></div><p class="muted">${rows.length} позиций · нарастающая очередь из планов. Количество в новом плане — снимок остатка, а не новая партия.</p><div class="actions" style="margin-bottom:12px"><button data-sort="order">Заказ–поз. ${sort==='order'?(desc?'↓':'↑'):'↕'}</button><button data-sort="alloy">Сплав ${sort==='alloy'?(desc?'↓':'↑'):'↕'}</button></div><div class="cards">${rows.map(r=>{const allocated=state.boxes.filter(b=>b.queue028===r.id).reduce((a,b)=>a+b.qty,0);return `<article class="card"><div class="bar"><h3>${esc(r.order)}–${esc(r.position)}</h3><span class="tag">${esc(r.alloy)}</span></div><div>${esc(r.name)}</div><div class="facts"><span>Наряд ${esc(r.ticket)}</span><span>План ${esc(r.planDate)} · группа ${esc(r.group)}</span><span>Срок ${esc(r.due||'не указан')}</span></div><div>${esc(r.operation||'Операция не указана')} · ${esc(r.regime||'Режим не указан')}</div><p>Остаток по плану <b>${r.remaining}</b> · распределено по ящикам <b>${allocated}</b> · основа ${r.basis} шт.</p><div class="actions"><button data-action="edit" data-id="${esc(r.id)}" ${canEdit()?'':'disabled'}>Новый снимок плана</button></div><details><summary>История планов (${r.history.length})</summary>${r.history.map(h=>`<p>${esc(h.snapshot.planDate)} · ${h.snapshot.remaining} шт. · зарегистрировано ${esc(fmt(h.recordedAt))} · ${esc(h.recordedBy||h.snapshot.enteredBy)}</p>`).join('')}</details></article>`}).join('')||'<div class="card">Очередь пуста. Начните с одной позиции бумажного плана.</div>'}</div>`}
function renderCharge(){const eligible=state.paperQueue028.filter(r=>(!alloy||r.alloy===alloy)&&(!regime||r.regime===regime));return `<div class="bar"><h2>M05-9 · Предложение загрузки</h2><button data-action="charge" class="primary" ${canEdit()?'':'disabled'}>Новая садка</button></div><p class="muted">Фильтр помогает подобрать кандидатов. Совместимость, вместимость, режим и приоритет подтверждает термист.</p><div class="filters"><select id="alloyFilter" aria-label="Сплав"><option value="">Все сплавы</option>${[...new Set(state.paperQueue028.map(r=>r.alloy))].map(a=>`<option ${a===alloy?'selected':''}>${esc(a)}</option>`).join('')}</select><select id="regimeFilter" aria-label="Режим"><option value="">Все режимы</option>${[...new Set(state.paperQueue028.map(r=>r.regime).filter(Boolean))].map(a=>`<option ${a===regime?'selected':''}>${esc(a)}</option>`).join('')}</select></div><div class="cards">${eligible.map(r=>`<div class="card"><b>${esc(r.order)}–${esc(r.position)} · ${esc(r.alloy)}</b><div>${esc(r.regime||'Назначение неизвестно')} · ${esc(r.operation)}</div><small>По плану ${r.remaining} шт. · учётная основа ${r.basis} шт.</small></div>`).join('')||'<div class="card">Нет подходящих позиций.</div>'}</div><h3>Созданные садки / запуски</h3><div class="cards">${state.runs.map(runCard).join('')||'<p>Пока нет садок.</p>'}</div>`}
function runCard(r){const l=last(r.id,'load'),u=last(r.id,'unload');return `<article class="card"><h3>${esc(r.charge)}</h3><div>${esc(r.furnace)} · ${esc(r.operation)} · ${esc(r.regime)}</div><p>${r.members.map(m=>esc(boxBy(m.box).number)+' · '+m.qty+' шт.').join(' + ')}</p>${r.assignmentReason?`<p class="notice">Назначил ${esc(r.assignedBy)} · ${esc(fmt(r.createdAt))}<br>Основание: ${esc(r.assignmentReason)}</p>`:''}<div class="facts"><span>Загрузка: ${esc(fmt(l?.at))}</span><span>Выгрузка: ${esc(fmt(u?.at))}</span></div><div class="actions"><button data-action="load" data-id="${esc(r.id)}" ${canEdit()?'':'disabled'}>${l?'Исправить загрузку':'Подтвердить загрузку'}</button><button data-action="unload" data-id="${esc(r.id)}" ${canEdit()&&l?'':'disabled'}>${u?'Исправить выгрузку':'Подтвердить выгрузку'}</button></div></article>`}
function renderPassports(){if(!state.boxes.length)return '<h2>M05-16 · Паспорта / садки</h2><div class="card">Паспорт появится при создании ящика в новой садке.</div>';const b=boxBy(selectedBox)||state.boxes[0];selectedBox=b.id;const fs=facts(b.id),review=[...fs].reverse().find(e=>e.kind==='review'),evidence=fs.filter(e=>e.kind!=='review').map(e=>e.id),reviewed=review&&evidence.every(i=>review.evidence.includes(i))&&linked(b.id).every(r=>last(r.id,'unload'));return `<h2>M05-16 · Паспорта / садки</h2><label style="margin-bottom:14px">Паспорт / ящик<select id="boxSelect">${state.boxes.map(x=>`<option value="${esc(x.id)}" ${x.id===b.id?'selected':''}>${esc(x.order)}–${esc(x.position)} · ${esc(x.number)} · ${x.qty} шт.</option>`).join('')}</select></label><article class="card"><h3>${esc(b.passport)}</h3><p>${esc(b.order)}–${esc(b.position)} · ${esc(b.alloy)} · ${b.qty} шт.</p><p>Исходное назначение: ${esc(b.operation)} · ${esc(b.regime)}</p><p><b>Проверка старшим: ${reviewed?'текущая история проверена':'требуется'}</b></p><p class="notice">Решение о дальнейшем использовании — диспетчер, при несоответствии разбор с ОТК. В первой обкатке это решение ведётся вне приложения.</p><div class="actions"><button data-action="measure" data-id="${esc(b.id)}" ${canEdit()?'':'disabled'}>+ Замер / контроль</button><button data-action="rework" data-id="${esc(b.id)}" ${canEdit()?'':'disabled'}>Повтор / новый режим</button><button data-action="review" data-id="${esc(b.id)}" ${canEdit()&&me.role==='senior'?'':'disabled'}>Проверить паспорт</button><button data-action="handoff" data-id="${esc(b.id)}" ${canEdit()?'':'disabled'}>Факт передачи</button></div></article><h3>Все обработки ящика</h3><div class="cards">${linked(b.id).map(runCard).join('')}</div><h3>История · факт и регистрация</h3>${history(b.id)}`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#main').innerHTML=(tab==='queue'?renderQueue():tab==='charge'?renderCharge():renderPassports())+'<details><summary>Архив и границы обкатки</summary><p>ОВЕН не подключён. Температура печи не доказывает температуру изделий. Приложение не управляет печью и не выдаёт разрешений на продукцию.</p><button id="export">Скачать копию журнала JSON</button><p class="muted">JSON — читаемая копия. Резервная копия SQLite и восстановление выполняются на сервере по инструкции IT. Импорт поверх общего журнала через браузер недоступен.</p>'+(demo?'<p><a href="'+esc(boot.demoBacklink||'./index.html')+'">Прежние экраны диспетчера и термиста UI028</a></p>':'')+'</details>';$('#export').onclick=()=>download('kist-journal.json',{...current,user:{login:me.login,role:me.role}});if($('#alloyFilter'))$('#alloyFilter').onchange=e=>{alloy=e.target.value;render()};if($('#regimeFilter'))$('#regimeFilter').onchange=e=>{regime=e.target.value;render()};if($('#boxSelect'))$('#boxSelect').onchange=e=>{selectedBox=e.target.value;render()}}
document.querySelector('nav').onclick=e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;render()}};
$('#main').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.sort){if(sort===b.dataset.sort)desc=!desc;else{sort=b.dataset.sort;desc=false}render();return}const a=b.dataset.action,i=b.dataset.id;if(a==='plan')positionForm();if(a==='edit')positionForm(rowBy(i));if(a==='charge')chargeForm();if(a==='load'||a==='unload')timeForm(runBy(i),a);if(a==='measure')measureForm(boxBy(i));if(a==='rework')reworkForm(boxBy(i));if(a==='review')reviewForm(boxBy(i));if(a==='handoff')handoffForm(boxBy(i))};
$('#logout').onclick=async()=>{if(pending){msg('Сначала подтвердите запись или скачайте копию неподтверждённого ввода');return}if(demo){if(confirm('Удалить записи только этого учебного примера?')){localStorage.removeItem(key+'.demo');location.reload()}return}try{const r=await fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':me.csrf},body:'{}'});if(!r.ok)throw Error('Не удалось завершить сеанс');location.reload()}catch(e){msg(e.message)}};
window.addEventListener('beforeunload',e=>{if(pending){e.preventDefault();e.returnValue=''}});
render();status();if(pending){status('Восстановлен неподтверждённый ввод. Повторите отправку или скачайте копию.',true)}
if(!demo)setInterval(async()=>{if(pending||busy||$('#dialog').open||document.hidden)return;try{const fresh=await getState();if(fresh.database!==boot.database||fresh.revision!==current.revision){accept(fresh);render()}status()}catch(e){status(e.message+' Связь с общей базой не подтверждена.',true)}},4000);
})();
</script></body></html>
