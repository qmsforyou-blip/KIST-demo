<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>КИСТ · UI036</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f5f7;background:#000;color-scheme:dark;--accent:#ff9f0a;--line:#303033}*{box-sizing:border-box}body{margin:0}header,main{max-width:1000px;margin:auto;padding:18px}header{padding-top:calc(20px + env(safe-area-inset-top))}h1{font-size:34px;letter-spacing:-1px;margin:14px 0}h2{font-size:24px;margin:8px 0 16px}h3{font-size:19px}.muted,small{color:#a1a1a6;font-size:13px}nav{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px}a,button{color:var(--accent)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;background:transparent;min-height:48px;padding:10px 14px;font-size:17px}button:disabled{opacity:.4;cursor:default}input,select,textarea{width:100%;min-height:48px;background:#242426;color:#f5f5f7;border:1px solid #454548;border-radius:9px;padding:11px;font-size:18px}textarea{min-height:90px;resize:vertical}label{display:block;font-size:14px;color:#c2c2c8;margin:14px 0 6px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.panel{background:#151517;border-radius:15px;padding:18px;margin:16px 0}.primary{background:var(--accent);color:#17120a;border-radius:11px;font-weight:600;margin-top:16px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.toolbar input{flex:1;min-width:150px;font-size:30px;letter-spacing:3px}.toolbar .primary{margin:0}.row{border-bottom:1px solid var(--line);padding:14px 0;display:flex;justify-content:space-between;gap:14px;align-items:center}.row button{padding:0;min-width:70px;text-align:right}.order-number{font-size:27px;letter-spacing:1px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}.wide{grid-column:1/-1}.positions{display:grid;gap:12px}.position{border:1px solid var(--line);padding:12px;border-radius:12px}.ratings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:18px 0}.rating{border:1px solid var(--line);border-radius:12px;padding:12px 4px;color:#f5f5f7;font-size:12px}.rating[aria-pressed=true]{border:2px solid #fff;background:#303033}.dot{width:35px;height:35px;border-radius:50%;display:block;margin:0 auto 10px}.grey .dot{background:#8e8e93}.green .dot{background:#30d158}.yellow .dot{background:#ffd60a}.red .dot{background:#ff453a}.signal{border-left:4px solid #ffd60a;padding:10px 14px;margin:12px 0;background:#25200d}.signal.red{border-color:#ff453a;background:#2c1414}.bad{color:#ff9f0a}.good{color:#30d158}.check{display:flex;align-items:center;gap:10px;font-size:16px}.check input{width:22px;min-height:22px}.error{color:#ff8a80;white-space:pre-wrap;padding:10px 0}#notice{min-height:20px;margin-top:12px;white-space:pre-wrap}.audit{font-size:13px;line-height:1.6;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}details{margin-top:14px}summary{cursor:pointer;padding:12px 0}.tag{display:inline-block;padding:5px 9px;background:#303033;border-radius:8px;font-size:12px}.scanner{width:48px;height:48px;padding:8px}.scanner svg{width:30px;height:30px}.empty{color:#a1a1a6;padding:20px 0}[hidden]{display:none!important}@media(max-width:600px){.grid{display:block}header,main{padding-left:14px;padding-right:14px}.panel{padding:14px}.toolbar{gap:4px}.toolbar .primary{font-size:15px;padding:10px}h1{font-size:32px}}
</style></head><body><header><div class="muted">УСМ · <span id="code"></span> · UI036</div><h1 id="title"></h1><div id="identity" class="muted"></div><nav id="nav"></nav><div id="notice" role="status" aria-live="polite"></div><div id="recovery" class="panel" hidden>Запрос ещё не подтверждён сервером. Не вводи его повторно.<div><button id="retry">Повторить</button><button id="exportPending">Скачать запрос</button></div></div></header><main id="main"></main><script>
(()=>{'use strict';const boot={"registry": true, "section": "admin", "demo": true, "database": "synthetic-registry036", "user": {"login": "demo-admin", "role": "admin", "csrf": "demo-no-session"}};
const demo=!!boot.demo,me=boot.user,section=boot.section,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uuid=()=>crypto.randomUUID(),copy=x=>JSON.parse(JSON.stringify(x));
const key='kist.registry036.'+boot.database+'.'+me.login,storage=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}};
let pending=storage(key+'.pending'),busy=false,info={workplaces:[],users:[],orders:[]},workplace=storage(key+'.workplace')||'',card=null,editor=null,importBatch=null,preview=null,colour='grey';
const canDispatch=['admin','dispatcher','senior','thermist'].includes(me.role),canAssess=['admin','supervisor','senior'].includes(me.role),master=['admin','dispatcher'].includes(me.role),functionName=section==='dispatch'?(master?'dispatcher':'thermist'):'supervisor';
function notice(s,bad=false){$('#notice').textContent=s;$('#notice').className=bad?'bad':''}
function download(name,value){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function fmt(v){return v?new Date(v).toLocaleString('ru-RU'):'—'}
const sourceName=s=>({DISPATCHER_MANUAL:'Данные Диспетчера',DISPATCHER_IMPORT_UNVERIFIED:'Импорт Диспетчера · кэш Excel не пересчитывался',THERMIST_PRELIMINARY:'Предварительные сведения термиста'}[s]||s);
function nameOf(id){return info.workplaces.find(x=>x.id===id)?.name||'Рабочее место не выбрано'}
function displayName(w){let names=[w.name],parent=w.parent_id,seen=new Set([w.id]);while(parent&&!seen.has(parent)){seen.add(parent);const p=info.workplaces.find(x=>x.id===parent);if(!p)break;names.unshift(p.name);parent=p.parent_id}return names.join(' → ')}
function workplaces(){return info.workplaces.filter(x=>x.kind==='terminal'&&x.enabled&&x.functions.includes(functionName)&&(me.role==='admin'||x.login===me.login))}
function workspaceSelect(){const places=workplaces();if(!places.some(x=>x.id===workplace))workplace=places[0]?.id||'';return '<label for="workplace">Именное рабочее место</label><select id="workplace"><option value="">Выбери рабочее место</option>'+places.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===workplace?'selected':'')+'>'+esc(displayName(x))+'</option>').join('')+'</select>'+(places.length?'':'<p class="bad">Администратору нужно назначить тебе рабочее место с нужной функцией.</p>')}
async function send(){if(busy)return;busy=true;$('#recovery').hidden=false;$('#retry').disabled=true;notice(demo?'Сохраняем учебную запись…':'Ожидаем подтверждение сервера…');try{let result;if(demo){try{result=demoCall(pending)}catch(e){e.status=422;throw e}}else{const r=await fetch('/api/registry',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':me.csrf},body:JSON.stringify(pending)});result=await r.json();if(!r.ok){const e=Error(result.error||'Ошибка сервера');e.status=r.status;throw e}}const request=pending;pending=null;localStorage.removeItem(key+'.pending');$('#recovery').hidden=true;busy=false;notice(demo?'Учебное демо · хранение только в этом браузере':'Подтверждено сервером');await accept(request,result);return result}catch(e){if(e.status&&e.status<500){pending=null;localStorage.removeItem(key+'.pending');$('#recovery').hidden=true}notice(e.message,true);throw e}finally{busy=false;$('#retry').disabled=false}}
async function call(action,values={}){if(busy||pending){notice('Сначала дождись подтверждения предыдущего запроса или повтори его.',true);return}pending={action,...values,database:boot.database,command:uuid()};if(action!=='create_user'&&!write(key+'.pending',pending)){pending=null;throw Error('Не удалось сохранить запрос для безопасного повтора')}return send()}
async function guarded(action,values){try{return await call(action,values)}catch(e){notice(e.message,true)}}
async function refresh(){return guarded('bootstrap',{section})}
async function lookup(number){if(!workplace){notice('Выбери рабочее место',true);return}return guarded('lookup',{section,workplace,number:String(number).trim()})}
async function accept(request,result){if(request.action!=='bootstrap'&&!info.workplaces.length)await refresh();if(request.action==='create_user'){await refresh();notice('Создан личный вход: '+result.login+' · теперь назначь рабочее место')}else if(request.action==='bootstrap'){info=result;render()}else if(request.action==='lookup'){card=result;editor=null;colour=result.assessments?.find(a=>a.actor===me.login&&a.workplace_id===workplace&&!a.stale)?.colour||'grey';render();notice(result.found?'Просмотр зарегистрирован · '+fmt(result.viewRecordedAt):'Поиск зарегистрирован. Такой заказ-наряд пока не найден.',!result.found)}else if(request.action==='save_workplace'){editor=null;await refresh()}else if(request.action==='save_order'){editor=null;await refresh();await lookup(result.number)}else if(request.action==='assess'){notice('Оценка зарегистрирована'+(result.signal?' · вопрос/проблема сохранены отдельно':''));await lookup(card.number)}else if(request.action==='preview_import'){preview=result;render()}else if(request.action==='import_orders'){importBatch=null;preview=null;card=null;await refresh();notice('Импортировано нарядов: '+result.imported)}else if(request.action==='audit'){$('#audit').innerHTML=result.events.map(e=>'<div class="row audit"><div><b>'+esc(e.kind)+'</b><br>'+esc(e.actor)+' · '+esc(nameOf(e.workplace_id))+'<br>'+esc(fmt(e.received_at))+'<br>'+esc(e.order_id||'')+'</div></div>').join('')||'<p>Записей пока нет</p>'}else if(request.action==='history'){$('#history').innerHTML=result.revisions.map(r=>'<div class="panel"><b>Редакция '+r.sequence+'</b> · '+esc(sourceName(r.source))+'<br>'+esc(r.actor)+' · '+esc(fmt(r.recorded_at))+'<pre>'+esc(JSON.stringify(r.data,null,2))+'</pre></div>').join('')}}
function field(name,label,value,type='text'){return '<div><label for="'+name+'">'+label+'</label><input id="'+name+'" name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(name==='number'?'inputmode="numeric" pattern="[0-9]{5}" maxlength="5" required':'')+'></div>'}
function admin(){return '<div class="toolbar"><button class="primary" id="newPlace">+ Рабочее место / группа</button></div><div class="panel"><h2>Иерархия рабочих мест</h2>'+info.workplaces.map(w=>'<div class="row"><div><b>'+esc(displayName(w))+'</b><br><small>'+esc(w.kind==='group'?'Группа':w.login+' · '+w.functions.join(', '))+' · '+(w.enabled?'включено':'отключено')+'</small></div><button data-edit-place="'+esc(w.id)+'">Изменить</button></div>').join('')+'</div><details><summary>Личные учётные записи</summary><form id="userForm"><label>Новый личный логин</label><input name="login" autocomplete="off" required maxlength="80"><label>Роль</label><select name="role"><option value="supervisor">Супервайзер</option><option value="thermist">Термист</option><option value="senior">Старший термист</option><option value="dispatcher">Диспетчер</option><option value="observer">Просмотр</option><option value="admin">Администратор</option></select><label>Личный пароль (не менее 12 символов)</label><input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="500" required><button class="primary">Создать личный вход</button></form><p class="muted">Пароль не сохраняется в журнале действий или локальном файле повторов. Затем назначь пользователю именное рабочее место.</p>'+info.users.map(x=>'<p>'+esc(x.login)+' · '+esc(x.role)+'</p>').join('')+'</details><div class="panel"><h2>Журнал просмотров и действий</h2><button id="auditLoad">Показать последние 200</button><div id="audit"></div></div>'}
function placeForm(){const e=editor;return '<div class="panel"><h2>'+esc(e.id?'Рабочее место':'Новое рабочее место')+'</h2><form id="placeForm"><label>Имя</label><input name="name" value="'+esc(e.name||'')+'" required maxlength="200"><label>Тип</label><select name="kind"><option value="group" '+(e.kind==='group'?'selected':'')+'>Группа</option><option value="terminal" '+(e.kind==='terminal'?'selected':'')+'>Именное веб-место / сотик</option></select><label>Родитель</label><select name="parent"><option value="">Корень</option>'+info.workplaces.filter(x=>x.kind==='group'&&x.id!==e.id).map(x=>'<option value="'+esc(x.id)+'" '+(x.id===e.parent_id?'selected':'')+'>'+esc(displayName(x))+'</option>').join('')+'</select><label>Личный логин (для веб-места)</label><select name="login"><option value="">Не назначен</option>'+info.users.map(x=>'<option '+(x.login===e.login?'selected':'')+'>'+esc(x.login)+'</option>').join('')+'</select><label>Функции веб-места</label>'+[['supervisor','Суперглаз'],['dispatcher','Диспетчер'],['thermist','Термист — первичные сведения']].map(([v,t])=>'<label class="check"><input type="checkbox" name="functions" value="'+v+'" '+((e.functions||[]).includes(v)?'checked':'')+'>'+t+'</label>').join('')+'<label class="check"><input type="checkbox" name="enabled" '+(e.enabled!==false&&e.enabled!==0?'checked':'')+'>Включено</label><button class="primary">Сохранить</button><button type="button" id="cancel">Отмена</button></form></div>'}
function positions(data){return data.positions.length?data.positions.map(p=>'<div class="position"><b>'+esc(p.position||'—')+' · '+esc(p.name||'Наименование не указано')+'</b><p>Количество: '+esc(p.qty??'—')+' · Сталь: '+esc(p.steel||'—')+'</p>'+(p.requirements?'<p>'+esc(p.requirements)+'</p>':'')+'</div>').join(''):'<p class="muted">Позиции ещё не заполнены</p>'}
function cardView(){if(!card)return '';if(!card.found)return '<div class="panel"><h2>№ '+esc(card.number)+' пока нет в реестре</h2>'+(canDispatch?'<button class="primary" id="draftOrder">Создать предварительную карточку</button>':'<p>Передай номер Диспетчеру или термисту для заведения карточки.</p>')+'</div>';const d=card.data;return '<div class="panel"><h2>Заказ-наряд № '+esc(card.number)+'</h2><p class="tag">'+esc(sourceName(card.source))+'</p><h3>'+esc(d.description||'Характеристики ещё не заполнены')+'</h3><p>Заказ: '+esc(d.orderNumber||'—')+'<br>Заказчик: '+esc(d.customer||'—')+'<br>Срок: '+esc(d.due||'—')+'</p><p>'+esc(d.note)+'</p><div class="positions">'+positions(d)+'</div><p class="muted">Внесено: '+esc(fmt(card.recordedAt))+' · '+esc(card.actor)+' · редакция '+card.sequence+'</p>'+(card.sourceMeta?.exportedAt?'<p class="muted">Снимок выгружен: '+esc(fmt(card.sourceMeta.exportedAt))+' · '+esc(card.sourceMeta.sourceFile||'')+'</p>':'')+(section==='dispatch'&&(master||card.source==='THERMIST_PRELIMINARY')?'<button class="primary" id="editOrder">Дополнить карточку</button>':'')+'<details><summary>Идентичность и просмотр</summary><p class="muted">Постоянный ID: '+esc(card.id)+'<br>Просмотр: '+esc(fmt(card.viewRecordedAt))+' · '+esc(nameOf(workplace))+'</p></details></div>'+ (section==='eye'?assessmentView():'')+'<div class="panel"><h2>Открытые вопросы и предварительные проблемы · '+card.signals.length+'</h2>'+card.signals.map(s=>'<div class="signal '+(s.kind==='PRELIMINARY_PROBLEM'?'red':'')+'"><b>'+(s.kind==='PRELIMINARY_PROBLEM'?'Предварительная проблема':'Вопрос')+'</b><p>'+esc(s.note)+'</p><small>'+esc(s.actor)+' · '+esc(fmt(s.created_at))+' · ответственный и план ещё не назначены</small></div>').join('')+'<p class="muted">Новая зелёная оценка не закрывает ранее зарегистрированные вопросы и проблемы. План реагирования добавим следующим этапом.</p></div>'+(['admin','dispatcher','senior','supervisor'].includes(me.role)?'<details><summary>История карточки</summary><button id="historyLoad">Загрузить редакции</button><div id="history"></div></details>':'')}
function assessmentView(){return '<div class="panel"><h2>Моя оценка</h2><p class="muted">Оценка наблюдателя; соответствие продукции и разрешение на использование фиксируются отдельно.</p>'+(canAssess?'<div class="ratings">'+[['grey','Не определено'],['green','Норма, нет вопросов'],['yellow','Вопрос'],['red','Проблема, предварительно']].map(([v,t])=>'<button type="button" data-colour="'+v+'" class="rating '+v+'" aria-pressed="'+(colour===v)+'"><span class="dot"></span>'+t+'</button>').join('')+'</div><label for="assessmentNote">Формулировка (обязательна для жёлтого и красного)</label><textarea id="assessmentNote" maxlength="2000">'+esc(card.assessments.find(a=>a.actor===me.login&&a.workplace_id===workplace&&!a.stale)?.note||'')+'</textarea><button class="primary" id="saveAssessment">Сохранить оценку</button>':'<p>Твоя роль разрешает просмотр. Для оценки нужна роль супервайзера или старшего термиста.</p>')+'<h3>Последние оценки наблюдателей</h3>'+card.assessments.map(a=>'<div class="row"><div><span class="tag">'+esc({grey:'Серый',green:'Зелёный',yellow:'Жёлтый',red:'Красный'}[a.colour])+'</span> '+esc(a.actor)+' · '+esc(a.workplaceName||nameOf(a.workplace_id))+'<p>'+esc(a.note)+'</p><small>'+esc(fmt(a.recorded_at))+(a.stale?' · оценка предыдущей редакции карточки':'')+'</small></div></div>').join('')+'</div>'}
function orderForm(){const e=editor,d=e.data;return '<div class="panel"><h2>'+esc(master?'Данные Диспетчера':'Предварительные сведения термиста')+'</h2><form id="orderForm"><div class="grid">'+field('number','Номер заказа-наряда · пять цифр',e.number)+field('orderNumber','Номер заказа (отдельный реквизит)',d.orderNumber)+field('description','Описание',d.description)+field('customer','Заказчик',d.customer)+field('due','Срок / дата',d.due)+'</div><label>Примечание</label><textarea name="note" maxlength="2000">'+esc(d.note)+'</textarea><h3>Позиции</h3>'+d.positions.map((p,i)=>'<div class="position"><div class="grid">'+field('p'+i+'position','Поз.',p.position)+field('p'+i+'name','Наименование',p.name)+field('p'+i+'steel','Сталь',p.steel)+field('p'+i+'qty','Количество',p.qty??'','number')+'</div><label>Требования</label><textarea name="p'+i+'requirements">'+esc(p.requirements)+'</textarea></div>').join('')+'<button type="button" id="addPosition">+ Позиция</button><div><button class="primary">Сохранить карточку</button><button type="button" id="cancel">Отмена</button></div></form></div>'}
function readEditor(){const f=$('#orderForm'),v=Object.fromEntries(new FormData(f));editor.number=v.number;editor.data={description:v.description,orderNumber:v.orderNumber,customer:v.customer,due:v.due,note:v.note,positions:editor.data.positions.map((_,i)=>{const raw=v['p'+i+'qty'];return {position:v['p'+i+'position'],name:v['p'+i+'name'],steel:v['p'+i+'steel'],qty:raw===''?null:Number(raw),requirements:v['p'+i+'requirements']}})}}
function blankOrder(num=''){return {type:'order',number:num,expected:null,data:{description:'',customer:'',orderNumber:'',due:'',note:'',positions:[{position:'',name:'',steel:'',qty:null,requirements:''}]}}}
function render(){if(section==='admin'){$('#main').innerHTML=editor?placeForm():admin()}else{$('#main').innerHTML='<div class="panel">'+workspaceSelect()+'<form id="lookupForm"><label for="numberLookup">Номер заказа-наряда</label><div class="toolbar"><input id="numberLookup" inputmode="numeric" maxlength="5" pattern="[0-9]{5}" value="'+esc(card?.number||new URL(location.href).searchParams.get('number')||'')+'" placeholder="12345" required aria-label="Пятизначный номер"><button class="scanner" type="button" disabled aria-label="Сканер QR — пока заглушка" title="Сканер QR — позже"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12V3h9M20 3h9v9M29 20v9h-9M12 29H3v-9M8 8h5v5H8zM19 8h5v5h-5zM8 19h5v5H8zM19 19h3v3h3v3h-6z"/></svg></button><button class="primary">Открыть</button></div><small>Сканер пока не подключён — введи пять цифр вручную.</small></form></div>'+(section==='dispatch'?'<div class="toolbar"><button id="newOrder" class="primary">+ Заказ-наряд</button></div>':'')+(editor?orderForm():cardView())+(section==='dispatch'&&!editor?'<div class="panel"><h2>Реестр нарядов</h2>'+info.orders.map(o=>'<div class="row"><div><b class="order-number">'+esc(o.number)+'</b><br>'+esc(o.description)+'<br><small>'+esc(sourceName(o.source))+'</small></div><button data-order="'+esc(o.number)+'">Открыть</button></div>').join('')+'</div>'+(master?'<div class="panel"><h2>Периодический снимок из Цех_сводная</h2><p class="muted">Выбери подготовленный JSON-экспорт. Сначала проверка и список изменений, затем отдельное подтверждение.</p><input id="importFile" type="file" accept=".json,application/json">'+(importBatch?'<p>Нарядов в файле: '+importBatch.orders.length+' · замечаний подготовки: '+(importBatch.reviewNotes?.length||0)+'</p><details><summary>Замечания подготовки</summary><ul>'+(importBatch.reviewNotes||[]).map(n=>'<li>'+esc((n.sourceCell||'')+' · '+n.reason)+'</li>').join('')+'</ul></details><button id="previewImport">Проверить импорт</button>':'')+(preview?'<p>Создать: '+preview.new+' · обновить: '+preview.updated+'</p><p class="bad">Подтверждение заменит текущие данные этих нарядов новым снимком; прежние редакции сохранятся. Проверь замечания экспортёра и актуальность исходной книги.</p><button class="primary" id="confirmImport">Подтвердить импорт</button>':'')+'</div>':''):'')}
 if($('#workplace'))$('#workplace').onchange=e=>{workplace=e.target.value;write(key+'.workplace',workplace);card=null;render()};

function demoCall(request){const demoKey='kist.registry036.demo',s=storage(demoKey)||{workplaces:[{id:'demo-group',name:'Учебный участок',kind:'group',parent_id:null,login:null,functions:[],enabled:true,version:1},{id:'demo-phone',name:'Учебный сотик',kind:'terminal',parent_id:'demo-group',login:'demo-admin',functions:['supervisor','dispatcher','thermist'],enabled:true,version:1}],orders:[{id:'demo-order',number:'12345',revision:'demo-r1',sequence:1,data:{description:'Учебный заказ-наряд',customer:'Учебный заказчик',orderNumber:'УЧ-001',due:'',note:'Все сведения вымышлены',positions:[{position:'1',name:'Учебная деталь',steel:'40Х',qty:100,requirements:'Учебное требование'}]},source:'DISPATCHER_MANUAL',actor:'demo-admin',recordedAt:'2026-10-31T03:00:00Z',assessments:[],signals:[]}],events:[],receipts:{}};
 if(s.receipts[request.command])return s.receipts[request.command];const event=(kind,o)=>{const e={id:uuid(),kind,order_id:o?.id||null,actor:me.login,workplace_id:request.workplace||null,received_at:new Date().toISOString()};s.events.push(e);return e};let result;
 if(request.action==='create_user'){throw Error('Создание реальных личных входов доступно только на сервере; в демо используется учебный администратор')}else if(request.action==='bootstrap'){event('REGISTRY_LIST_VIEW');result={workplaces:s.workplaces,users:[{login:'demo-admin',role:'admin'}],orders:s.orders.map(o=>({id:o.id,number:o.number,description:o.data.description,source:o.source})),role:'admin'}}
 else if(request.action==='save_workplace'){if(!request.name)throw Error('Укажи имя');const old=s.workplaces.find(x=>x.id===request.id);const w={id:old?.id||uuid(),name:request.name,kind:request.kind,parent_id:request.parent||null,login:request.kind==='terminal'?request.login:null,functions:request.functions,enabled:request.enabled,version:(old?.version||0)+1};if(w.parent_id===w.id)throw Error('Цикл иерархии');if(old)s.workplaces[s.workplaces.indexOf(old)]=w;else s.workplaces.push(w);event('WORKPLACE_CHANGED');result={id:w.id}}
 else if(request.action==='lookup'){if(!/^[0-9]{5}$/.test(request.number))throw Error('Нужны пять цифр');const o=s.orders.find(x=>x.number===request.number),v=event(o?'ORDER_VIEW':'ORDER_NOT_FOUND',o);result=o?{...copy(o),found:true,assessments:o.assessments.map(a=>({...a,stale:a.revision_id!==o.revision})),view:v.id,viewRecordedAt:v.received_at}:{found:false,number:request.number}}
 else if(request.action==='save_order'){if(!/^[0-9]{5}$/.test(request.number))throw Error('Нужны пять цифр');let o=s.orders.find(x=>x.number===request.number);if(o&&o.revision!==request.expected)throw Error('Карточка изменилась');if(!o){o={id:uuid(),number:request.number,sequence:0,assessments:[],signals:[]};s.orders.push(o)}o.data=request.data;o.sequence++;o.revision=uuid();o.source='DISPATCHER_MANUAL';o.actor=me.login;o.recordedAt=new Date().toISOString();event('ORDER_CHANGED',o);result={number:o.number}}
 else if(request.action==='assess'){const v=s.events.find(x=>x.id===request.view),o=s.orders.find(x=>x.id===v?.order_id);if(!o)throw Error('Открой карточку');if(['yellow','red'].includes(request.colour)&&!request.note.trim())throw Error('Нужна формулировка');const a={id:uuid(),revision_id:o.revision,actor:me.login,workplace_id:request.workplace,colour:request.colour,note:request.note,recorded_at:new Date().toISOString(),stale:false};o.assessments=[a];let signal=null;if(['yellow','red'].includes(a.colour)){signal=uuid();o.signals.push({id:signal,kind:a.colour==='red'?'PRELIMINARY_PROBLEM':'QUESTION',note:a.note,actor:me.login,created_at:a.recorded_at})}event('ASSESSMENT_RECORDED',o);result={id:a.id,signal}}
 else if(request.action==='audit'){result={events:copy(s.events).reverse().slice(0,200)};event('AUDIT_VIEW')}
 else if(request.action==='history'){result={revisions:[]};event('HISTORY_VIEW')}
 else if(request.action==='preview_import'){if(request.batch.format!=='KIST_WORK_ORDERS_V1')throw Error('Неверный формат');const rows=request.batch.orders;result={expected:Object.fromEntries(rows.map(r=>[r.number,s.orders.find(o=>o.number===r.number)?.revision||null])),count:rows.length,new:rows.filter(r=>!s.orders.some(o=>o.number===r.number)).length,updated:rows.filter(r=>s.orders.some(o=>o.number===r.number)).length}}
 else if(request.action==='import_orders'){throw Error('Импорт с серверными проверками доступен в общей базе; в демо создай учебную карточку вручную')}
 else throw Error('Неизвестное действие');s.receipts[request.command]=copy(result);if(!write(demoKey,s))throw Error('Не удалось сохранить демо');return result}
if(pending){$('#recovery').hidden=false;notice('Остался неподтверждённый запрос — повтори его перед продолжением.',true)}else refresh();
})();</script></body></html>
